version: '3.8'

services:
  jant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jant-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - jant_data:/app/data

volumes:
  jant_data:
    driver: local
